# OrthoStudio XP imagery provider registry (docs/specs/imagery-providers.md, section 4).
#
# Thirteen providers alive in September 2026 without a key or token, converted from the
# Ortho4XP definitions named in each comment (docs/providers-audit.md). Values marked
# "assumed" are not in those files and wait for `osxp doctor --providers` to confirm them.
# max_in_flight: the most requests in flight each server took on 2026-09-15, rising until it
# refused, slowed down or gave no more (docs/benchmarks/network.md, section 7); 128 at most for the
# services of a state, which many people share. server_req_per_s: the requests per second a server
# gave there when it, not the line, was the limit. It is a ceiling, not only a figure for the
# estimates: no more than that many requests a second are started, whatever the window allows.
# The numbers below were measured as the servers' own ceilings, so the cap binds only where the
# server was already the limit; a source of one's own may name a far lower rate for a small
# server that blocks a caller it finds too eager (a user's EOX source, 2026-09-24).

schema = 1

# ------------------------------------------------------------------ global

[providers.BI]
# Providers/Global/BI.lay. Its host r{0-3}.ortho.tiles.virtualearth.net (HTTP/1.1, clear,
# g=136) replaced by the HTTPS HTTP/2 shards with the same bytes (docs/benchmarks/network.md).
url_template = "https://ecn.t{switch:0,1,2,3}.tiles.virtualearth.net/tiles/a{quadkey}.jpeg?g=15312"
max_zl = 19  # assumed (Bing serves 20-21 over some cities)
max_in_flight = 128  # measured ceiling, 4 hostnames x 32 streams; 192 gave no more (2026-09-15)
placeholder = { header_name = "X-VE-Tile-Info", header_value = "no-tile", size = 1033, blake3 = "1abc2dcd9d153b229306d34096a74a2e97587a1b5a74f00b75990207d3e0b484" }
attribution = "Microsoft Bing Maps aerial imagery"
name = "Bing Maps"
terms_url = "https://www.microsoft.com/en-us/maps/product/terms"

[providers.Arc]
# Providers/Global/Arc.lay (http:// upgraded to https by the server; HTTP/1.1).
url_template = "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{zoom}/{y}/{x}"
max_zl = 19  # assumed
max_in_flight = 128  # 16, 32, 64, 128, 256 gave 249, 512, 915, 1 124, 1 116 req/s, no error
placeholder = { size = 2521 }  # O4_Imagery_Utils.py:1029-1032 ("no data yet" tile)
attribution = "Esri World Imagery (Esri, Maxar, Earthstar Geographics, and the GIS User Community)"
name = "Esri World Imagery"
terms_url = "https://www.esri.com/en-us/legal/terms/full-master-agreement"

[providers."Arc@"]
# Providers/Global/Arc@.lay, Esri "Clarity" beta endpoint (HTTP/2). No placeholder rule in
# Ortho4XP for this host (its rule tests "arcgisonline" in the URL): open point.
url_template = "https://clarity.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/{zoom}/{y}/{x}"
max_zl = 19  # assumed
max_in_flight = 192  # 64, 128, 192, 256 gave 176, 411, 522, 448 req/s; two 502 at 256
server_req_per_s = 522
attribution = "Esri World Imagery Clarity (Esri, Maxar, Earthstar Geographics, and the GIS User Community)"
name = "Esri World Imagery Clarity"
terms_url = "https://www.esri.com/en-us/legal/terms/full-master-agreement"

[providers.EOX]
# Providers/Global/EOX.lay and EOX2.lay asked a.s2maps-tiles.eu, which refused them (403, the
# audit); EOX serves the same Sentinel-2 mosaic, now "EOxCloudless", at tiles.maps.eox.at (HTTP/2,
# 2026-09-22). One pixel per 10 m of ground, so ZL14 at most: a pilot flying IFR long haul asked
# for it, light on his machine. Over open sea it answers a plain dark blue 256x256 PNG, which
# decodes like the JPEGs. Free for non-commercial use (CC BY-NC-SA 4.0), its credit shown.
url_template = "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2024_3857/default/g/{zoom}/{y}/{x}.jpg"
max_zl = 14
# 8, 16, 32 and 64 in flight gave 76, 138, 224 and 240 req/s from here with no error
# (2026-09-22), and those are what this line held until a user's builds kept failing on EOX
# (2026-09-24): from his address the server stops answering around 90 req/s, and he gets his
# imagery whole at 4 in flight and 20 requests a second. A measured throughput is not a ceiling
# a server tolerates from everyone, and since 0.1.14 this rate is one we hold to rather than one
# we merely do not exceed. So it is now his, with a little room for a slow line: a ZL14 tile is
# 5 120 pieces, which is four minutes, on a source made for flying high.
max_in_flight = 8
server_req_per_s = 20
attribution = "EOxCloudless https://cloudless.eox.at by EOX IT Services GmbH (Contains modified Copernicus Sentinel data 2024)"
name = "EOX Sentinel-2 cloudless 2024"  # they publish a new mosaic every year, and the
# address names the one we ask for: the list must say which, or a pilot cannot tell (user, 2026-09-24)
terms_url = "https://cloudless.eox.at/documentation/license"
licence = "CC BY-NC-SA 4.0, non-commercial use only"

# ------------------------------------------------------------------ national

[providers.Lux]
# Providers/Luxembourg/Lux.lay (http:// -> https; HTTP/1.1). Extent bounds from
# Extents/LowRes/Luxembourg.ext.
url_template = "https://{switch:wmts1,wmts2}.geoportail.lu/opendata/wmts/ortho_latest/GLOBAL_WEBMERCATOR_4_V3/{zoom}/{x}/{y}.jpeg"
max_zl = 20  # assumed
max_in_flight = 16  # 16 gave 130 req/s; 32 gave 102 req/s and two timeouts
server_req_per_s = 130
extent = "Luxembourg"
extent_bounds = [5.7, 49.42, 6.56, 50.22]
attribution = "Administration du cadastre et de la topographie, Luxembourg (geoportail.lu open data)"
name = "geoportail.lu"
terms_url = "https://data.public.lu/en/datasets/orthophoto-officielle-du-grand-duche-de-luxembourg-edition-2023/"

[providers.NL]
# Providers/Netherland/NL.lay: WMTS, layer Actueel_ortho25, TileMatrixSet EPSG:3857 of
# capabilities.xml (the web-mercator pyramid, identifiers 00..19). Same as PDOK.
url_template = "https://service.pdok.nl/hwh/luchtfotorgb/wmts/v1_0?&SERVICE=WMTS&VERSION=1.0.0&REQUEST=GetTile&LAYER=Actueel_ortho25&STYLE=&FORMAT=image/jpeg&TILEMATRIXSET=EPSG:3857&TILEMATRIX={zoom:02d}&TILEROW={y}&TILECOL={x}"
max_zl = 19  # from the capabilities (matrices 00..19)
max_in_flight = 32  # one host for the five layers: 16, 32, 64 gave 122, 181, 108 req/s
server_req_per_s = 181
extent = "Netherlands"
extent_bounds = [3.06, 50.72, 7.26, 53.76]
attribution = "Beeldmateriaal Nederland via PDOK (CC BY 4.0)"
name = "PDOK"
same_as = "PDOK"  # the same address and layer as PDOK: listed once
terms_url = "https://www.pdok.nl/introductie/-/article/luchtfoto-pdok"

[providers.PDOK]
# Providers/Netherland/PDOK.lay (identical to NL, the in_GUI entry of Ortho4XP).
