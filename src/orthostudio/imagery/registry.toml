[providers.JP]
# Providers/Japan/JP.lay (http:// -> https; max_threads=8 in the .lay). 2007 imagery with
# partial coverage; the .lay comment recommends .comb use only.
url_template = "https://cyberjapandata.gsi.go.jp/xyz/ort/{zoom}/{x}/{y}.jpg"
max_zl = 18  # GSI "ort" tiles are served up to 18
max_in_flight = 64  # 8, 16, 32, 64 gave 11, 22, 46, 103 req/s (0.75 s from Europe), no error
server_req_per_s = 103
attribution = "Geospatial Information Authority of Japan (GSI) orthophoto tiles"
name = "GSI"
extent = "Japan"
extent_bounds = [122.9, 20.4, 154.0, 45.6]  # Yonaguni to Minamitorishima, Okinotorishima to Hokkaido
terms_url = "https://maps.gsi.go.jp/development/ichiran.html"

