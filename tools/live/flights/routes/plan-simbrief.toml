title = "Plan SimBrief Bergen-Oslo : départ, montée, croisière, un direct-to hors route, descente"
note = """The pilot's last SimBrief plan, ENBR-ENGM, flown from just after take-off: its departure's turns,
250 kt up to 10,000 ft, FL250 at 460 kt, then a direct-to off the route (from 9.86 E straight to
the approach, cutting the plan's dogleg south over 59.75 N, up to 35 km off it), the descent
keeping 460 kt, 250 kt under 10,000 ft, the approach. Flown twice: with the SimBrief name (Live
follows the route) and without (Live looks straight ahead only); 5 to 11 E crossed."""
