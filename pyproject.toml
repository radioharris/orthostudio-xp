[project]
name = "orthostudio-xp"
version = "0.1.18"
description = "Orthophoto scenery for X-Plane 12: Ortho4XP's rules, a new architecture, faster."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
authors = [{ name = "OrthoStudio XP contributors" }]
dependencies = [
  "numpy>=2.2",
  "scipy>=1.15",
  "shapely>=2.1",
  "pyproj>=3.7",
  "pillow>=11",
  "httpx[http2]>=0.28",
  "blake3>=1.0",
  "zstandard>=0.23",
  "orjson>=3.10",
  "py7zr>=1.1.3",
  "pydantic>=2.10",
  "platformdirs>=4",
  "typer>=0.15",
  "ispc-texcomp>=1.0.1",
  "curl_cffi>=0.10",
  # named, although curl_cffi installs it: the packaged app verifies with this bundle and
  # not with the system's (orthostudio/net/certs.py)
  "certifi>=2024.7",
  # the window of its own (orthostudio/window.py). A pure Python wheel, which asks nothing of the
  # system by itself: the toolkit under it is what a system may lack, and where it does the
  # browser opens instead. It travels everywhere, Linux included, or the advice the doctor gives
  # there would lead nowhere: the packages it names are useless without this (2026-09-20).
  "pywebview>=6.2",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "sse-starlette>=2", "uvicorn>=0.34"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.9",
  "mypy>=1.14",
  "hypothesis>=6",
  "scikit-image>=0.25",
  "pytest-xdist>=3.8",
]

[project.scripts]
orthostudio = "orthostudio.cli:main"
osxp = "orthostudio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orthostudio"]
# Written when the installers are built, from the repository's secrets, and ignored by git since
# the repository is public. Hatchling honours .gitignore, so without this line the file is
# silently dropped from the wheel and every release ships with no library (2026-09-23).
artifacts = ["src/orthostudio/library.json"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]
extend-exclude = ["native", "fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "xplane: reads the local X-Plane 12 install, read only (skipped without it)",
  "network: talks to real servers (local only)",
]

[tool.mypy]
python_version = "3.12"
packages = ["orthostudio"]
ignore_missing_imports = true
