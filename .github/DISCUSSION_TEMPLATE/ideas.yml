labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the idea. The ideas are read before each version is planned, and the ones with the most votes come first. One idea per discussion, please: two ideas, two discussions. If someone already asked for yours, vote for it and add what you need.
  - type: textarea
    id: want
    attributes:
      label: What you would like
      placeholder: "Build only the overlays of a tile, without the photos."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What it would change for you, in flight or while building.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Another tool, a workaround, or nothing.
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Screenshots, a tile, a place. Drop the images here.
