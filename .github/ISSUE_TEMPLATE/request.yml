name: A request
description: Something you would like OrthoStudio XP to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the idea. Every request lands on one list, read before each version is planned. One request per issue, please: two ideas, two issues.
  - type: textarea
    id: want
    attributes:
      label: What you would like
      placeholder: "Build only the overlays of a tile, without the photos."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What it would change for you, in flight or while building.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Another tool (Ortho4XP, AutoOrtho...), a workaround, or nothing.
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Screenshots, a tile, a place. Drop the images here.
