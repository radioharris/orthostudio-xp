name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # macOS is tested on the developer's machine (with the tests that read its X-Plane); its
        # runners cost ten times the minutes of Linux ones.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no major tag since v8: an immutable release is pinned instead
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Build Triangle4XP
        run: |
          cmake -S native/triangle4xp -B native/triangle4xp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native/triangle4xp/build --config Release
      - run: uv sync --all-extras --all-groups
      - run: uv run orthostudio doctor
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -n auto -m "not network"
