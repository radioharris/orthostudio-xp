name: release
# The installers of OrthoStudio XP (tools/package/build.py, docs/specs/packaging.md): each built and
# checked on its own system. A tag v* publishes them as a GitHub release; a manual run only keeps
# them as the run's artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  package:
    name: installer (${{ matrix.os }}${{ matrix.machine && format(' {0}', matrix.machine) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macOS 14 on Apple Silicon: the wheels chosen there run on macOS 14 and later. The Intel
        # app on macOS 15 (Apple Silicon too, checked under Rosetta): pyproj's Intel wheels ask for
        # macOS 15. Ubuntu 22.04: Triangle4XP compiled there runs on the older glibc of the
        # distributions still in use. The private repository where the betas are made builds the
        # Apple Silicon and Windows installers alone: a macOS minute counts ten of the account's,
        # and the Intel Mac's and Linux's installers are not tried there (2026-10-03).
        include: >-
          ${{ fromJSON(github.repository == 'radioharris/orthostudio-xp-dev'
          && '[{"os": "macos-14"}, {"os": "windows-latest"}]'
          || '[{"os": "macos-14"}, {"os": "macos-15", "machine": "x86_64"},
          {"os": "windows-latest"}, {"os": "ubuntu-22.04"}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Install Rosetta
        if: matrix.machine == 'x86_64'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Build Triangle4XP
        run: |
          cmake -S native/triangle4xp -B native/triangle4xp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native/triangle4xp/build --config Release
      - run: uv sync --frozen --no-dev
      # The address and the key of the prepared library, which the repository does not hold: it
      # is public. Without them the installer reaches no library and downloads every tile live,
      # exactly as every version before 0.1.17 (docs/specs/osm-prepared.md).
      - name: Carry the prepared library
        shell: bash
        env:
          URL: ${{ secrets.OSXP_LIBRARY_URL }}
          TOKEN: ${{ secrets.OSXP_LIBRARY_TOKEN }}
        run: |
          # `secrets` cannot be read in a step's `if`, which made the whole workflow invalid and
          # a tag build nothing at all; the test belongs here, where the value is in the
          # environment (2026-09-23)
          if [ -z "${URL:-}" ]; then echo "no library configured; the build carries none"; exit 0; fi
          python -c "import json,os,pathlib; pathlib.Path('src/orthostudio/library.json').write_text(json.dumps({'url': os.environ['URL'], 'token': os.environ['TOKEN']}))"
      - run: >-
          uv run --no-sync python tools/package/build.py --check
          ${{ matrix.machine && format('--machine {0}', matrix.machine) || '' }}
      - uses: actions/upload-artifact@v7
        if: github.repository != 'radioharris/orthostudio-xp-dev'
        with:
          name: installer-${{ matrix.os }}${{ matrix.machine && format('-{0}', matrix.machine) || '' }}
          path: |
            dist/OrthoStudio-XP-*.dmg
            dist/OrthoStudio-XP-*-setup.exe
            dist/OrthoStudio-XP-*.zip
            dist/OrthoStudio-XP-*.tar.gz
          if-no-files-found: error
      # The betas' private repository puts its installers in a pre-release of its own, one for
      # each run: its artifacts count against the free plan's 0.5 GB, which held one beta and not
      # the next (2026-10-03), and a release's files do not.
      - name: Put the installer in the beta's pre-release
        if: github.repository == 'radioharris/orthostudio-xp-dev'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: beta-${{ github.run_number }}
        run: |
          shopt -s nullglob
          files=(dist/OrthoStudio-XP-*.dmg dist/OrthoStudio-XP-*-setup.exe)
          if [ ${#files[@]} -eq 0 ]; then echo "no installer in dist"; exit 1; fi
          name=$(basename "${files[0]}"); version=${name#OrthoStudio-XP-}; version=${version%%-*}
          # each system's job comes here: the first makes the release, the other finds it made
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Beta $version (${GITHUB_SHA::7})" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA}. Not signed." \
            || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
  publish:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the notes of the version (docs/releases/<version>.md) when written, else a line
          notes="docs/releases/${GITHUB_REF_NAME#v}.md"
          if [ -f "$notes" ]; then
            set -- --notes-file "$notes"
          else
            set -- --notes "Installers of OrthoStudio XP $GITHUB_REF_NAME, not signed: README.md says how to open them the first time."
          fi
          # a plain version tag (v0.1.1) makes a release, a tag with a suffix (v0.2.0-rc.1) a pre-release
          case "$GITHUB_REF_NAME" in *-*) set -- "$@" --prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "OrthoStudio XP $GITHUB_REF_NAME" "$@"
