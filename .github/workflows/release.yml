name: release
# The installers of OrthoStudio XP (tools/package/build.py, docs/specs/packaging.md): each built and
# checked on its own system. A tag v* makes them a GitHub release: a draft first, which each
# system's installer goes into as soon as it is built, published once all four are in. A manual run
# keeps them as the run's artifacts, for a day.
#
# No artifact carries a tag's installers from one job to the next: artifacts count against the
# account's storage, which builds in a private repository filled ("Artifact storage quota has been
# hit", 2026-10-03), and the files of a release do not.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  draft:
    name: release draft
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: docs/releases
      - name: Make the draft the installers go into
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a run started again finds its draft there already
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "the release of $GITHUB_REF_NAME is there already"; exit 0
          fi
          # the notes of the version (docs/releases/<version>.md) when written, else a line
          notes="docs/releases/${GITHUB_REF_NAME#v}.md"
          if [ -f "$notes" ]; then
            set -- --notes-file "$notes"
          else
            set -- --notes "Installers of OrthoStudio XP $GITHUB_REF_NAME, not signed: README.md says how to open them the first time."
          fi
          # a plain version tag (v0.1.1) makes a release, a tag with a suffix (v0.2.0-rc.1) a pre-release
          case "$GITHUB_REF_NAME" in *-*) set -- "$@" --prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "OrthoStudio XP $GITHUB_REF_NAME" "$@"
  package:
    name: installer (${{ matrix.os }}${{ matrix.machine && format(' {0}', matrix.machine) || '' }})
    needs: draft
    # a manual run makes no draft (the job is skipped), and its installers are built all the same
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macOS 14 on Apple Silicon: the wheels chosen there run on macOS 14 and later. The Intel
        # app on macOS 15 (Apple Silicon too, checked under Rosetta): pyproj's Intel wheels ask for
        # macOS 15. Ubuntu 22.04: Triangle4XP compiled there runs on the older glibc of the
        # distributions still in use.
        include:
          - os: macos-14
          - os: macos-15
            machine: x86_64
          - os: windows-latest
          - os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Install Rosetta
        if: matrix.machine == 'x86_64'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Build Triangle4XP
        run: |
          cmake -S native/triangle4xp -B native/triangle4xp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native/triangle4xp/build --config Release
      - run: uv sync --frozen --no-dev
      # The address and the key of the prepared library, which the repository does not hold: it
      # is public. Without them the installer reaches no library and downloads every tile live,
      # exactly as every version before 0.1.17 (docs/specs/osm-prepared.md).
      - name: Carry the prepared library
        shell: bash
        env:
          URL: ${{ secrets.OSXP_LIBRARY_URL }}
          TOKEN: ${{ secrets.OSXP_LIBRARY_TOKEN }}
        run: |
          # `secrets` cannot be read in a step's `if`, which made the whole workflow invalid and
          # a tag build nothing at all; the test belongs here, where the value is in the
          # environment (2026-09-23)
          if [ -z "${URL:-}" ]; then echo "no library configured; the build carries none"; exit 0; fi
          python -c "import json,os,pathlib; pathlib.Path('src/orthostudio/library.json').write_text(json.dumps({'url': os.environ['URL'], 'token': os.environ['TOKEN']}))"
      - run: >-
          uv run --no-sync python tools/package/build.py --check
          ${{ matrix.machine && format('--machine {0}', matrix.machine) || '' }}
      - name: Put the installer in the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/OrthoStudio-XP-*.dmg dist/OrthoStudio-XP-*-setup.exe dist/OrthoStudio-XP-*.zip dist/OrthoStudio-XP-*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then echo "no installer was built"; exit 1; fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: installer-${{ matrix.os }}${{ matrix.machine && format('-{0}', matrix.machine) || '' }}
          path: |
            dist/OrthoStudio-XP-*.dmg
            dist/OrthoStudio-XP-*-setup.exe
            dist/OrthoStudio-XP-*.zip
            dist/OrthoStudio-XP-*.tar.gz
          if-no-files-found: error
          retention-days: 1
  publish:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release, every installer in it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
